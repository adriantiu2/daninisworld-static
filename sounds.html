<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sounds - Danini's World</title>
    <link rel="stylesheet" href="styles.css">
<script src="readonly.js"></script>
<link rel="stylesheet" href="readonly.css">
</head>
<body class="sounds">
    <div class="container">
        <h1><a href="index.html">Danini's World</a></h1>
        <div class="nav">
            <a href="outfits.html">outfits</a>
            <a href="reviews.html">reviews</a>
            <a href="art.html">art</a>
            <a href="sounds.html">sounds</a>
        </div>

        <button id="addSoundBtn">add sound</button>

        <div id="uploadForm" style="display: none;">
            <div class="form-group">
                <label for="audioInput">Audio file:</label>
                <input type="file" id="audioInput" accept="audio/*">
            </div>
            <div class="form-group">
                <label for="titleInput">Title:</label>
                <input type="text" id="titleInput" placeholder="Title">
            </div>
            <div class="form-group">
                <label for="soundImageInput">Image (optional):</label>
                <input type="file" id="soundImageInput" accept="image/*">
            </div>
            <div class="form-group">
                <label for="artistInput">Artist:</label>
                <input type="text" id="artistInput" placeholder="Artist">
            </div>
            <div class="form-group">
                <label for="noteInput">Note:</label>
                <textarea id="noteInput" rows="4" placeholder="Write a note about this sound..."></textarea>
            </div>
            <div class="form-group">
                <label>Tags:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="soundCategory" value="Music"> Music</label>
                </div>
            </div>
            <input type="password" id="passwordInput" placeholder="Password" required>
            <button id="uploadBtn">Upload</button>
            <button id="cancelBtn">Cancel</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="Music">Music</button>
            <button id="addCategoryBtn" class="filter-btn" style="background-color: #E3E3E3;">+</button>
        </div>

        <div id="soundsGallery" class="gallery"></div>
    </div>
    <script src="sounds.js"></script>
    <script src="lightbox.js"></script>
</body>
</html>
