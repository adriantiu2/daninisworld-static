<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art - Danini's World</title>
    <link rel="stylesheet" href="styles.css">
<script src="readonly.js"></script>
<link rel="stylesheet" href="readonly.css">
</head>
<body>
    <div class="container">
        <h1><a href="index.html">Danini's World</a></h1>
        <div class="nav">
            <a href="outfits.html">outfits</a>
            <a href="reviews.html">reviews</a>
            <a href="art.html">art</a>
            <a href="sounds.html">sounds</a>
        </div>

        <button id="addImageBtn">add artwork</button>

        <div id="uploadForm" style="display: none;">
            <input type="file" id="imageInput" accept="image/*,video/*" multiple>
            <div class="form-group">
                <label for="titleInput">Title:</label>
                <input type="text" id="titleInput" placeholder="Title">
            </div>
            <div class="form-group">
                <label>Categories:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="artCategory" value="Film"> Film</label>
                    <label><input type="checkbox" name="artCategory" value="Drawing"> Drawing</label>
                    <label><input type="checkbox" name="artCategory" value="Painting"> Painting</label>
                    <label><input type="checkbox" name="artCategory" value="Digital"> Digital</label>
                    <label><input type="checkbox" name="artCategory" value="Sculpture"> Sculpture</label>
                </div>
            </div>
            <div class="form-group">
                <label for="mediumInput">Medium:</label>
                <input type="text" id="mediumInput" placeholder="Medium">
            </div>
            <div class="form-group">
                <label for="sizeInput">Size:</label>
                <input type="text" id="sizeInput" placeholder="Size">
            </div>
            <div class="form-group">
                <label for="yearInput">Year:</label>
                <input type="text" id="yearInput" placeholder="Year (e.g., 2024)">
            </div>
            <input type="password" id="passwordInput" placeholder="Password" required>
            <button id="uploadBtn">Upload</button>
            <button id="cancelBtn">Cancel</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="Film">Film</button>
            <button class="filter-btn" data-category="Drawing">Drawing</button>
            <button class="filter-btn" data-category="Painting">Painting</button>
            <button class="filter-btn" data-category="Digital">Digital</button>
            <button class="filter-btn" data-category="Sculpture">Sculpture</button>
            <button id="addCategoryBtn" class="filter-btn" style="background-color: #E3E3E3;">+</button>
        </div>
        <div id="gallery" class="gallery"></div>
    </div>
    <script src="art.js"></script>
    <script src="lightbox.js"></script>
</body>
</html>
